name: SaleWork Daily Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run SaleWork sync
        env:
          SALEWORK_USERNAME: ${{ secrets.SALEWORK_USERNAME }}
          SALEWORK_PASSWORD: ${{ secrets.SALEWORK_PASSWORD }}
          BIKEFORCE_SUPABASE_URL: ${{ secrets.BIKEFORCE_SUPABASE_URL }}
          BIKEFORCE_SERVICE_ROLE_KEY: ${{ secrets.BIKEFORCE_SERVICE_ROLE_KEY }}
        run: npm run salework:sync