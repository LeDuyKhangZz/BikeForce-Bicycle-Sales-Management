name: Pancake Daily Report

on:
  schedule:
    # 09:00 giờ Việt Nam: báo cáo ngày hiện tại.
    - cron: '0 2 * * *'
    # 17:00 giờ Việt Nam: cập nhật lại báo cáo ngày hiện tại.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      ngay:
        description: 'Ngày báo cáo (yyyy-MM-dd); bỏ trống để dùng hôm nay theo giờ Việt Nam'
        required: false
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      PANCAKE_API_KEY: ${{ secrets.PANCAKE_API_KEY }}
      BIKEFORCE_SUPABASE_URL: ${{ secrets.BIKEFORCE_SUPABASE_URL }}
      BIKEFORCE_SERVICE_ROLE_KEY: ${{ secrets.BIKEFORCE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Chọn ngày báo cáo theo giờ Việt Nam
        id: report-date
        shell: pwsh
        env:
          MANUAL_DATE: ${{ inputs.ngay }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vietnamNow = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(7))
          if (-not [string]::IsNullOrWhiteSpace($env:MANUAL_DATE)) {
            $reportDate = $env:MANUAL_DATE
          }
          else {
            $reportDate = $vietnamNow.ToString('yyyy-MM-dd')
          }
          "date=$reportDate" >> $env:GITHUB_OUTPUT
          "csv=artifacts/pancake-report-$reportDate.csv" >> $env:GITHUB_OUTPUT
          "summary=artifacts/pancake-summary-$reportDate.txt" >> $env:GITHUB_OUTPUT
          Write-Host "Ngày báo cáo: $reportDate (UTC+7)"

      - name: Lấy báo cáo Pancake
        shell: pwsh
        run: |
          ./Get-PancakeReport.ps1 `
            -Ngay '${{ steps.report-date.outputs.date }}' `
            -OutCsv '${{ steps.report-date.outputs.csv }}' `
            -OutSummary '${{ steps.report-date.outputs.summary }}'

      - name: Đồng bộ báo cáo vào Supabase
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:BIKEFORCE_SUPABASE_URL) -or
              [string]::IsNullOrWhiteSpace($env:BIKEFORCE_SERVICE_ROLE_KEY)) {
            throw 'Thiếu BIKEFORCE_SUPABASE_URL hoặc BIKEFORCE_SERVICE_ROLE_KEY.'
          }

          $dailyRows = @(Import-Csv '${{ steps.report-date.outputs.csv }}')
          $sourceRows = @(Import-Csv 'artifacts/pancake-report-${{ steps.report-date.outputs.date }}-by-source.csv')
          $headers = @{
            apikey = $env:BIKEFORCE_SERVICE_ROLE_KEY
            Authorization = "Bearer $($env:BIKEFORCE_SERVICE_ROLE_KEY)"
            'Content-Type' = 'application/json'
            # Supabase secret key mới từ chối User-Agent mặc định giống browser của PowerShell.
            'User-Agent' = 'BikeForce-Pancake-Worker/1.0'
          }
          $rpcUri = "$($env:BIKEFORCE_SUPABASE_URL.TrimEnd('/'))/rest/v1/rpc/upsert_pancake_daily_report"

          foreach ($row in $dailyRows) {
            $sources = @(
              $sourceRows |
                Where-Object { $_.Ngay -eq $row.Ngay } |
                ForEach-Object {
                  [ordered]@{
                    source_name = $_.NguonDon
                    order_count = [int]$_.SoDon
                    revenue = [long]$_.DoanhThu
                  }
                }
            )
            $body = [ordered]@{
              p_report_date = $row.Ngay
              p_shop_id = [long]$row.ShopId
              p_order_count = [int]$row.SoDon
              p_revenue = [long]$row.DoanhThu
              p_cancelled_count = [int]$row.DonHuy
              p_returned_count = [int]$row.DonHoan
              p_late_count = [int]$row.DonTre
              p_ads_order_count = [int]$row.DonTuAds
              p_ads_gmv = [long]$row.GMV_Ads
              p_sources = $sources
            } | ConvertTo-Json -Depth 5 -Compress

            try {
              Invoke-RestMethod -Method Post -Uri $rpcUri -Headers $headers -Body $body | Out-Null
            }
            catch {
              # Chỉ log JSON lỗi PostgREST; không log URI/header vì chúng chứa secret.
              $safeDetail = $_.ErrorDetails.Message
              if ([string]::IsNullOrWhiteSpace($safeDetail)) {
                $safeDetail = 'Supabase không trả nội dung lỗi.'
              }
              throw "Không đồng bộ được báo cáo Pancake ngày $($row.Ngay) vào Supabase: $safeDetail"
            }
            Write-Host "Đã đồng bộ báo cáo Pancake ngày $($row.Ngay) vào Supabase."
          }

      - name: Gửi tóm tắt qua Telegram nếu đã cấu hình
        if: ${{ success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $summary = Get-Content -Raw -Encoding utf8 '${{ steps.report-date.outputs.summary }}'
          $telegramUri = "https://api.telegram.org/bot$($env:TELEGRAM_BOT_TOKEN)/sendMessage"
          try {
            $response = Invoke-RestMethod -Method Post -Uri $telegramUri -Body @{
              chat_id = $env:TELEGRAM_CHAT_ID
              text = $summary
            }
            if (-not $response.ok) {
              Write-Warning 'Telegram không chấp nhận tin nhắn; báo cáo CSV vẫn hợp lệ.'
            }
          }
          catch {
            Write-Warning 'Không gửi được Telegram; báo cáo CSV vẫn hợp lệ. Kiểm tra TELEGRAM_BOT_TOKEN và TELEGRAM_CHAT_ID.'
          }

      - name: Tải CSV lên artifact
        uses: actions/upload-artifact@v4
        with:
          name: pancake-report-${{ steps.report-date.outputs.date }}-${{ github.run_id }}
          path: |
            ${{ steps.report-date.outputs.csv }}
            artifacts/pancake-report-${{ steps.report-date.outputs.date }}-by-source.csv
          if-no-files-found: error
          retention-days: 30
